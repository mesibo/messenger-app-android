// NOTE: The following script is entirely optional and used exclusively by the mesibo development team
// to redirect build outputs to an internal development path. It is NOT required to build this project.
// If you are an external contributor, you can safely ignore this block.
final File mesiboScript = file("/code/android/java/buildscripts/mesibo.gradle")
if (mesiboScript.exists()) {
    apply from: mesiboScript
} 

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.0'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
